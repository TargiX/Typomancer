<!DOCTYPE html>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..800&family=Unbounded:wght@400..900&family=Victor+Mono:ital,wght@0,400..700;1,400..700&display=swap');
      /* TYPE — three faces, three jobs.
         Unbounded: display. Wide, heavy, reads like a thick keycap legend.
         Victor Mono: the line you type. Its italic is a true cursive, so a
           character's speech is set in handwriting — in Russian too.
         Martian Mono: instruments. Condensed a notch so tracked labels fit. */
      :root {
        --font-display: 'Unbounded', 'Martian Mono', system-ui, sans-serif;
        --font-prose: 'Victor Mono', 'Martian Mono', ui-monospace, monospace;
        --font-ui: 'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

        /* PALETTE — a keycap colourway, not a dashboard. Warm charcoal case,
           cream doubleshot legends, one orange modifier. Green and red stay
           semantic (clean / broken) and never decorate. */
        --ink-0: #0e0d10;     /* the desk */
        --ink-1: #151418;     /* the case */
        --ink-2: #1e1c22;     /* raised plate */
        --cap-top: #2d2b33;   /* dark alpha keycap, top face */
        --cap-side: #1b1a1f;  /* keycap skirt */
        --cap-lip: #08070a;   /* the shadow a keycap throws */
        --legend: #efe7d6;    /* cream legend */
        --legend-dim: #7c7684;
        --signal: #ff6a2b;    /* orange modifier */
        --signal-hi: #ff8f5c;
        --signal-deep: #b8410f;
        --hairline: rgba(239, 231, 214, 0.08);
      }
      html { background-color: var(--ink-0); }
      body {
        font-family: var(--font-ui);
        font-stretch: 87.5%;
        background-color: var(--ink-0);
        color: var(--legend);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .font-mono { font-family: var(--font-ui); }
      .font-display { font-family: var(--font-display); font-stretch: normal; letter-spacing: -0.01em; }
      .font-prose { font-family: var(--font-prose); font-stretch: normal; }
      ::selection { background: var(--signal); color: #140a05; }
      /* Matte PBT grain, instead of a dotted dashboard grid */
      .tex-grid {
        background-image: radial-gradient(rgba(239,231,214,0.035) 1px, transparent 1px);
        background-size: 3px 3px;
      }
      /* KEYCAP — a sculpted cap, not a bordered chip. Top face with a slight
         dish, a darker skirt below it, and the lip shadow it throws on the
         plate. It sinks when pressed (see [data-pressed] and :active). */
      .keycap {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.75em;
        height: 1.75em;
        padding: 0 0.5em 0.12em;
        font-family: var(--font-ui);
        font-stretch: 87.5%;
        font-size: 0.72em;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.02em;
        color: var(--legend);
        background:
          radial-gradient(120% 90% at 50% 20%, rgba(255,255,255,0.09), transparent 60%),
          linear-gradient(180deg, #3a3842, var(--cap-top) 55%, #26242b);
        border-radius: 0.34em;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.14),
          inset 0 -1px 0 rgba(0,0,0,0.35),
          0 0.18em 0 0 var(--cap-side),
          0 0.18em 0 1px rgba(0,0,0,0.55),
          0 0.34em 0.5em rgba(0,0,0,0.55);
        transform: translateY(-0.1em);
        vertical-align: baseline;
        transition: transform 70ms ease-out, box-shadow 70ms ease-out;
        text-shadow: 0 1px 0 rgba(0,0,0,0.4);
      }
      .keycap--signal {
        color: #1a0b04;
        text-shadow: 0 1px 0 rgba(255,255,255,0.25);
        background:
          radial-gradient(120% 90% at 50% 20%, rgba(255,255,255,0.28), transparent 60%),
          linear-gradient(180deg, var(--signal-hi), var(--signal) 55%, #e8561c);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.35),
          inset 0 -1px 0 rgba(0,0,0,0.2),
          0 0.18em 0 0 var(--signal-deep),
          0 0.18em 0 1px rgba(0,0,0,0.55),
          0 0.34em 0.6em rgba(0,0,0,0.5);
      }
      .keycap--cream {
        color: #1d1a16;
        text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        background:
          radial-gradient(120% 90% at 50% 20%, rgba(255,255,255,0.5), transparent 60%),
          linear-gradient(180deg, #f6efe0, #e6dcc6 55%, #d9cdb4);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.6),
          inset 0 -1px 0 rgba(0,0,0,0.12),
          0 0.18em 0 0 #a89c84,
          0 0.18em 0 1px rgba(0,0,0,0.55),
          0 0.34em 0.6em rgba(0,0,0,0.5);
      }
      .keycap[data-pressed="true"],
      *:active > .keycap,
      [data-pressed="true"] .keycap {
        transform: translateY(0.08em);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.1),
          inset 0 -1px 0 rgba(0,0,0,0.35),
          0 0 0 0 var(--cap-side),
          0 0 0 1px rgba(0,0,0,0.55),
          0 0.08em 0.2em rgba(0,0,0,0.6);
      }
      /* Custom scrollbar for log */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3a3740;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #56525e;
      }
      
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* SHAKE INTENSITIES */
      .shake-mild {
        animation: shake-mild 0.4s cubic-bezier(.36,.07,.19,.97) both;
      }
      .shake-medium {
        animation: shake-medium 0.4s cubic-bezier(.36,.07,.19,.97) both;
      }
      .shake-heavy {
        animation: shake-heavy 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }

      @keyframes shake-mild {
        0% { transform: translate3d(0, 0, 0); }
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-2px, 0, 0); }
        40%, 60% { transform: translate3d(2px, 0, 0); }
        100% { transform: translate3d(0, 0, 0); }
      }
      
      @keyframes shake-medium {
        0% { transform: translate(0, 0); }
        10% { transform: translate(-3px, -1px); }
        20% { transform: translate(3px, 1px); }
        30% { transform: translate(-3px, 2px); }
        40% { transform: translate(3px, -1px); }
        50% { transform: translate(-3px, 1px); }
        60% { transform: translate(2px, -2px); }
        100% { transform: translate(0, 0); }
      }

      @keyframes shake-heavy {
        0% { transform: translate(0, 0) rotate(0deg); }
        10% { transform: translate(-5px, -3px) rotate(-1deg); }
        20% { transform: translate(5px, 3px) rotate(1deg); }
        30% { transform: translate(-6px, 4px) rotate(-2deg); }
        40% { transform: translate(6px, -3px) rotate(2deg); }
        50% { transform: translate(-5px, 2px) rotate(-1deg); }
        60% { transform: translate(4px, -4px) rotate(1deg); }
        80% { transform: translate(-2px, 1px) rotate(0deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }

      /* DEBRIS PARTICLES (Error) */
      @keyframes fall-and-fade {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(200px) rotate(360deg); opacity: 0; }
      }
      
      .debris {
        position: absolute;
        pointer-events: none;
        animation: fall-and-fade 0.8s ease-in forwards;
        z-index: 100;
      }

      /* SPARK PARTICLES (Overclock) */
      @keyframes particle-explode {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
      }
      
      .char-particle {
        position: fixed; /* Fixed relative to viewport to handle scroll easily */
        pointer-events: none;
        border-radius: 50%;
        z-index: 9999;
        animation: particle-explode 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      /* CRACK OVERLAY */
      /* Glass cracks: hairlines that stay hairlines at any panel size
         (vector-effect: non-scaling-stroke on the paths). */
      .crack-path {
        fill: none;
        stroke: rgba(239, 231, 214, 0.42);
        stroke-width: 1.25;
        stroke-linecap: round;
        stroke-linejoin: miter;
        filter: drop-shadow(0 1px 0 rgba(0,0,0,0.9));
      }
      .crack-path.deep {
         stroke: rgba(255, 214, 220, 0.75);
         stroke-width: 1.75;
      }

      /* TENSE Mood Effect */
      @keyframes flicker {
        0% { opacity: 0.98; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        5% { opacity: 1; box-shadow: inset 0 0 10px rgba(0,0,0,0.0); }
        10% { opacity: 0.96; }
        15% { opacity: 1; }
        20% { opacity: 0.99; }
        50% { opacity: 1; }
        100% { opacity: 1; }
      }
      .flicker-effect {
        animation: flicker 4s infinite;
      }

      /* HOPEFUL Mood Effect */
      @keyframes pulse-glow {
        0%, 100% { box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.05); }
        50% { box-shadow: inset 0 0 40px rgba(16, 185, 129, 0.15); }
      }
      .glow-effect {
        animation: pulse-glow 4s ease-in-out infinite;
      }
      
      /* Impact Flash */
      @keyframes flash-red {
          0% { background-color: rgba(220, 38, 38, 0.3); }
          100% { background-color: transparent; }
      }
      .flash-overlay {
          animation: flash-red 0.2s ease-out forwards;
      }

      /* COMBO pop — retriggered on each correct keystroke */
      @keyframes combo-pop {
          0% { transform: scale(1); }
          35% { transform: scale(1.28); }
          100% { transform: scale(1); }
      }
      .combo-pop {
          animation: combo-pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* THE TRACER — the Security Trace drawn on the line you are typing.
         Characters behind the burn front are being consumed; the gap between
         the front and your caret is your safety margin, made visible. */
      /* The burn front leaves redaction behind it: typed text is blacked out
         the way a leaked ledger is, with an ember line where it still smoulders.
         Characters stay in the DOM (and the layout), only their ink is gone. */
      @keyframes tracer-flicker {
          0%, 100% { box-shadow: inset 0 -2px 0 rgba(255, 77, 109, 0.55); }
          50% { box-shadow: inset 0 -2px 0 rgba(255, 77, 109, 0.25); }
      }
      .tracer-burned {
          color: transparent;
          background: #050406;
          box-shadow: inset 0 -2px 0 rgba(255, 77, 109, 0.45);
          text-shadow: none;
          animation: tracer-flicker 1.4s ease-in-out infinite;
      }
      @keyframes tracer-head-pulse {
          from { box-shadow: inset -2px 0 0 #ff8f5c, 0 0 4px rgba(255, 77, 109, 0.5); }
          to { box-shadow: inset -2px 0 0 #ff8f5c, 0 0 14px rgba(255, 106, 43, 0.9); }
      }
      .tracer-head {
          color: #ffd6dc;
          background: rgba(255, 77, 109, 0.28);
          border-radius: 0 2px 2px 0;
          box-shadow: inset -2px 0 0 #ff8f5c;
          animation: tracer-head-pulse 0.45s ease-in-out infinite alternate;
      }
      .tracer-panel-closing {
          box-shadow: inset 0 0 60px rgba(244, 63, 94, 0.14);
      }
      @keyframes tracer-panel-alarm {
          0%, 100% { box-shadow: inset 0 0 70px rgba(244, 63, 94, 0.22); }
          50% { box-shadow: inset 0 0 110px rgba(244, 63, 94, 0.42); }
      }
      .tracer-panel-critical {
          animation: tracer-panel-alarm 0.7s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
          .tracer-burned,
          .tracer-head,
          .tracer-panel-critical {
              animation: none;
          }
      }

      .engine-tracer-brief {
          display: flex;
          align-items: center;
          gap: 0.9rem;
          padding: 0.85rem 1rem;
          border: 1px solid rgba(244, 63, 94, 0.28);
          background: rgba(244, 63, 94, 0.06);
          border-radius: 0.6rem;
      }
      .engine-tracer-brief-strip {
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 0.95rem;
          letter-spacing: -0.05em;
          white-space: nowrap;
      }

      /* Floating consequence deltas (evidence/heat/trust) drifting up over the scene */
      @keyframes delta-float {
          0% { transform: translateY(6px) scale(0.9); opacity: 0; }
          15% { transform: translateY(0) scale(1); opacity: 1; }
          70% { opacity: 1; }
          100% { transform: translateY(-46px) scale(1); opacity: 0; }
      }
      .delta-float {
          animation: delta-float 1.9s ease-out forwards;
      }

      /* Fade-up entrance used across menus/panels */
      @keyframes fade-in-up {
          0% { transform: translateY(10px); opacity: 0; }
          100% { transform: translateY(0); opacity: 1; }
      }
      .animate-fade-in-up {
          animation: fade-in-up 0.4s ease-out both;
      }

      /* Start-typing cue: a quick neon gate before each active segment appears */
      @keyframes type-cue-lock {
          0% { transform: translateY(12px) scale(0.92); opacity: 0; filter: blur(8px); }
          18% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
          72% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
          100% { transform: translateY(-10px) scale(1.03); opacity: 0; filter: blur(5px); }
      }
      @keyframes type-cue-word {
          0% { letter-spacing: 0.5em; text-shadow: 0 0 4px rgba(255,106,43,0.3); }
          45% { letter-spacing: 0.2em; text-shadow: 0 0 26px rgba(255,106,43,0.7), 0 0 50px rgba(255,143,92,0.35); }
          100% { letter-spacing: 0.24em; text-shadow: 0 0 14px rgba(255,106,43,0.5); }
      }
      @keyframes type-cue-glyph {
          0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
          25% { transform: rotate(90deg) scale(1.15); opacity: 1; }
          100% { transform: rotate(180deg) scale(1); opacity: 0.8; }
      }
      @keyframes type-cue-scan {
          0% { transform: translateX(-120%); opacity: 0; }
          20% { opacity: 1; }
          100% { transform: translateX(120%); opacity: 0; }
      }
      .type-cue-lockup {
          position: relative;
          animation: type-cue-lock 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .type-cue-lockup::before,
      .type-cue-lockup::after {
          content: "";
          position: absolute;
          left: 50%;
          width: min(42vw, 340px);
          height: 1px;
          transform: translateX(-50%);
          background: linear-gradient(90deg, transparent, rgba(255,106,43,0.9), rgba(239,231,214,0.6), transparent);
          overflow: hidden;
      }
      .type-cue-lockup::before { top: -18px; }
      .type-cue-lockup::after { bottom: -18px; }
      .type-cue-word {
          color: var(--legend);
          font-size: clamp(3.2rem, 9vw, 7.4rem);
          font-weight: 700;
          line-height: 0.85;
          animation: type-cue-word 1.5s ease-out both;
      }
      .type-cue-glyph {
          display: grid;
          place-items: center;
          width: 44px;
          height: 44px;
          color: var(--signal);
          font-size: 34px;
          text-shadow: 0 0 18px rgba(255,106,43,0.9);
          animation: type-cue-glyph 1.5s ease-out both;
      }
      .type-cue-sub {
          color: #a39d95;
          font-size: 0.68rem;
          font-weight: 800;
          letter-spacing: 0.32em;
          text-transform: uppercase;
          opacity: 0.9;
      }

      /* ===== Buttons are keycaps =====
         Every action is a key you could press: a top face, a skirt that shows
         below it, the shadow it throws on the plate. Pressing it — with the
         mouse or the matching key on the real keyboard ([data-pressed]) —
         sinks the cap into the plate. No cut corners, no running sheen. */
      .btn-cyber {
          --cap-face: linear-gradient(180deg, #34323a 0%, #2a2830 60%, #25232a 100%);
          --cap-skirt: #17161b;
          --cap-ring: rgba(0, 0, 0, 0.6);
          --cap-travel: 5px;
          position: relative;
          isolation: isolate;
          border: 0;
          border-radius: 12px;
          cursor: pointer;
          color: var(--legend);
          background:
            radial-gradient(140% 120% at 50% 0%, rgba(255,255,255,0.07), transparent 55%),
            var(--cap-face);
          box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.10),
            inset 0 -2px 0 rgba(0,0,0,0.25),
            0 var(--cap-travel) 0 0 var(--cap-skirt),
            0 var(--cap-travel) 0 1px var(--cap-ring),
            0 calc(var(--cap-travel) + 6px) 18px rgba(0,0,0,0.55);
          transform: translateY(calc(var(--cap-travel) * -1));
          margin-top: var(--cap-travel);
          transition: transform 80ms cubic-bezier(.3,.7,.4,1), box-shadow 80ms cubic-bezier(.3,.7,.4,1), filter 160ms ease, color 160ms ease;
      }
      .btn-cyber::before,
      .btn-cyber::after { content: none; }
      .btn-cyber:hover { filter: brightness(1.12); }
      .btn-cyber:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }
      .btn-cyber:active:not(:disabled),
      .btn-cyber[data-pressed="true"] {
          transform: translateY(-1px);
          box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.08),
            inset 0 -1px 0 rgba(0,0,0,0.25),
            0 1px 0 0 var(--cap-skirt),
            0 1px 0 1px var(--cap-ring),
            0 3px 6px rgba(0,0,0,0.6);
      }

      /* Unbounded is wide: a keycap label set in it stays one size smaller
         and barely tracked, so two-word actions fit on one cap. */
      .btn-cyber.font-display {
          font-size: 14px;
          letter-spacing: 0.02em;
          padding-left: 16px;
          padding-right: 16px;
          line-height: 1.2;
      }

      /* Primary — the orange modifier. There is at most one per screen. */
      .btn-cyber-primary {
          --cap-face: linear-gradient(180deg, #ff8a52 0%, #ff6a2b 55%, #f05a1c 100%);
          --cap-skirt: #a8390c;
          color: #1c0c04 !important;
          text-shadow: 0 1px 0 rgba(255,255,255,0.22);
      }
      .btn-cyber-primary .keycap {
          color: var(--legend);
          background: linear-gradient(180deg, #2a1208, #1a0b05);
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0.14em 0 0 #0b0503, 0 0.24em 0.4em rgba(0,0,0,0.35);
          text-shadow: none;
      }

      /* Ghost — a dark alpha cap. */
      .btn-cyber-ghost { color: var(--legend) !important; }
      .btn-cyber-ghost:hover { color: #fff !important; }

      /* Danger — a dark cap with a red legend. */
      .btn-cyber-danger { color: #ff8a9c !important; --cap-skirt: #1f1015; }

      /* ===== System beacon — live signal monitor ===== */
      @keyframes scope-scroll {
          from { transform: translateX(0); }
          to { transform: translateX(-50%); }
      }
      .scope-scroll { animation: scope-scroll 1.8s linear infinite; }
      @keyframes beacon-scan {
          0% { transform: translateY(-120%); }
          100% { transform: translateY(360%); }
      }
      .beacon-scan { animation: beacon-scan 2.8s ease-in-out infinite; }
      @keyframes beacon-flicker {
          0%, 100% { opacity: 1; }
          92% { opacity: 1; }
          94% { opacity: 0.55; }
          96% { opacity: 1; }
          97% { opacity: 0.7; }
      }
      .beacon-flicker { animation: beacon-flicker 4s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
          .scope-scroll,
          .beacon-scan,
          .beacon-flicker {
              animation: none;
          }
      }

      /* Focus meter — holographic oil-slick shimmer when the charge is full ("use it now") */
      @keyframes focus-holo {
          0% { background-position: 0% 50%; }
          100% { background-position: 200% 50%; }
      }
      .focus-holo {
          background-image: linear-gradient(100deg, #22d3ee 0%, #4ade80 18%, #bef264 33%, #a78bfa 50%, #22d3ee 66%, #4ade80 84%, #22d3ee 100%);
          background-size: 200% 100%;
          animation: focus-holo 1.4s linear infinite;
      }
      @keyframes focus-ready-pulse {
          0%, 100% { box-shadow: 0 0 10px rgba(74,222,128,0.45); }
          50% { box-shadow: 0 0 20px rgba(74,222,128,0.85); }
      }
      .focus-ready-pulse { animation: focus-ready-pulse 1.2s ease-in-out infinite; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
